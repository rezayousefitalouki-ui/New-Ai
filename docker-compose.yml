name: socialmind-ai
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-socialmind}
      POSTGRES_USER: ${POSTGRES_USER:-socialmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-socialmind} -d ${POSTGRES_DB:-socialmind}"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./apps/backend
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.development}
      DATABASE_URL: ${DATABASE_URL:-postgres://socialmind:socialmind@postgres:5432/socialmind}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    ports: ["${API_PORT:-8000}:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready/')"]
      interval: 10s
      timeout: 4s
      retries: 6
  celery:
    build: ./apps/backend
    env_file: .env
    command: ["celery", "-A", "config", "worker", "-l", "INFO"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
  celery-beat:
    build: ./apps/backend
    env_file: .env
    command: ["celery", "-A", "config", "beat", "-l", "INFO"]
    depends_on:
      redis: {condition: service_healthy}
    restart: unless-stopped
  frontend:
    build: ./apps/frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on:
      backend: {condition: service_healthy}
  video-studio:
    build: ./video-engine/remotion
    ports: ["${VIDEO_STUDIO_PORT:-3001}:3001"]
  nginx:
    image: nginx:1.27-alpine
    ports: ["${NGINX_PORT:-8080}:80"]
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
volumes:
  postgres_data:
  redis_data:

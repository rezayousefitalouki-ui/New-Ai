[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "socialmind-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2", "asyncpg>=0.30,<1", "fastapi>=0.115,<1",
  "pydantic-settings>=2.7,<3", "redis>=5.2,<6", "sqlalchemy>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1"
]
[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1"]
[tool.hatch.build.targets.wheel]
packages = ["app"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.pytest.ini_options]
asyncio_mode = "auto"
